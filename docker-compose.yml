version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "1650:5432"
    networks:
      - erp-network

  app:
    build: .
    command: yarn dev --hostname 0.0.0.0
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/erp?schema=public"
    depends_on:
      - db
    volumes:
      - .:/workspace
      - /workspace/node_modules
    working_dir: /workspace
    networks:
      - erp-network

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
